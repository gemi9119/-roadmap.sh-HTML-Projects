<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <header>
        <h2>Acme Support</h2>
        <span>
            <a href="home">Home</a>
            <a href="help">Help</a>
            <a href="contact">Contact</a>
        </span>
    </header>
    <main>
        <h1>Contact us</h1>
        <p>Send is a message and we will get back to you</p>
        <form action="#" method="post">
            <div>
                <label for="fullname">Full name</label>
                <input type="text" name="fullname" id="fullname" placeholder="John Doe" required>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="example@gmail.com" required>
            </div>
            <div>
                <label for="subject">Subject</label>
                <select name="subject" id="subject" required>
                    <option value="not select" selected>Choose a topic</option>
                    <option value="web developer">Web Developer</option>
                    <option value="freelance">Freelance</option>
                    <option value="-">-</option>
                </select>
            </div>
            <div>
                <label for="message">Message</label>
                <textarea name="message" id="message" minlength="1000"></textarea>
            </div>
            <fieldset aria-required="true">
                <legend>How did you hear about us?</legend>
                <input type="radio" name="search" id="radio-1">Search <br>
                <input type="radio" name="friend" id="radio-2">Friend <br>
                <input type="radio" name="social" id="radio-3">Social media
            </fieldset>
            <input type="checkbox" name="news" id="news">Send me product updates <br>
            <button type="submit">Send message</button>
        </form>
    </main>
    <footer>
        <span>&copy; 2026 Acme Support</span>
    </footer>
</body>
</html>
