<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Comparison Table</title>
</head>
<body>
    <header>
        <h2>Acme Plans</h2>
        <span>
            <a href="home">Home</a>
            <a href="about">About</a>
            <a href="contact">Contact</a>
        </span>
    </header>
    <main>
        <table>
            <caption>Plan comparison</caption>
            <thead>
                <tr>
                    <th scope="col">Plan</th>
                    <th scope="col">Storage</th>
                    <th scope="col">Projects</th>
                    <th scope="col">Support</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td scope="row">Free</td>
                    <td>5 GB</td>
                    <td>3</td>
                    <td>Email</td>
                </tr>
                <tr>
                    <td scope="row">Pro</td>
                    <td>100 GB</td>
                    <td>25</td>
                    <td>Priority Email</td>
                </tr>
                <tr>
                    <td scope="row">Business</td>
                    <td>1 TB</td>
                    <td>Unlimited</td>
                    <td>24/7 Phone</td>
                </tr>
            </tbody>
            <tfoot>
                <td colspan="4" scope="row">All plans include SSL and daily backups</td>
            </tfoot>
        </table>
    </main>
    <footer>
        <span>&copy; 2025 Mysite</span>
    </footer>
</body>
</html>
