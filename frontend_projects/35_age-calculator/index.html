<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="./node_modules/js-datepicker/dist/datepicker.min.css">
     
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #ffffff;
        color: #111111;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1.5rem;
    }

    .calculator-container {
        width: 100%;
        max-width: 400px;
        text-align: center;
    }

    h1 {
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 2rem;
    }

    .form-group {
        text-align: left;
        margin-bottom: 0.75rem;
    }

    label {
        display: block;
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
    }

    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-wrapper input {
        width: 100%;
        padding: 0.8rem 2.8rem 0.8rem 1rem;
        font-size: 1rem;
        font-family: inherit;
        font-weight: 600;
        color: #111;
        background-color: #ffffff;
        border: 2px solid #000000;
        border-radius: 8px;
        outline: none;
        cursor: pointer;
        transition: border-color 0.2s ease;
    }

    .calendar-icon {
        position: absolute;
        right: 0.85rem;
        pointer-events: none;
        display: flex;
        align-items: center;
        color: #000000;
    }

    .error-message {
        color: #dc2626;
        font-size: 0.85rem;
        font-weight: 500;
        margin-top: 0.4rem;
        min-height: 1.2rem;
    }

    button {
        width: 100%;
        padding: 0.85rem;
        font-size: 1rem;
        font-weight: 600;
        font-family: inherit;
        color: #ffffff;
        background-color: #525252;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    button:hover {
        background-color: #383838;
    }

    .result-container {
        margin-top: 2rem;
        font-size: 1.35rem;
        font-weight: 500;
        color: #111111;
    }

    .result-container strong {
        font-weight: 700;
    }

    .hidden {
        display: none;
    }
</style>
<body>
    <main class="calculator-container">
        <h1>Age Calculator</h1>
        <form id="age-form" novalidate>
            <div class="form-group">
                <label for="birthdate">Enter your birth date:</label>
                <div class="input-wrapper">
                    <input type="text" id="birthdate" placeholder="DD/MM/YYYY" readonly autocomplete="off">
                    <span class="calendar-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </span>
                </div>
                <p id="error-message" class="error-message"></p>
            </div>
            <button type="submit" id="calc-btn">Calculate</button>
        </form>
        <div id="result" class="result-container hidden"></div>
    </main>

    <script src="./node_modules/js-datepicker/dist/datepicker.min.js"></script>
    <script src="./node_modules/luxon/build/global/luxon.min.js"></script>
    <script script src="datepicker.js"></script>
</body>
</html>
