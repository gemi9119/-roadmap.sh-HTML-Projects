<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip UI</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    header{
        width: 100%;
        font-size: 26px;
        margin: 1em;
        border: none;
    }
    header nav {
        display: flex;
        justify-content: space-between;
        height: 100%;
        padding: 1em;
        background: linear-gradient(0.25turn, #e66465, #9198e5);
        border-radius: 10px;
        color: white;
    }
    nav ul{
        display: flex;
        justify-content: end;
    }
    nav ul li.nav-item{
        list-style: none;
        display: flex;
        align-items: center;
        height: fit-content;
        position: relative;
    }
    nav ul li+li::before{
        display: inline-block;
        content: '';
        width: 0.2em;
        height: 0.2em;
        background-color: #474747;
        border-radius: 100%;
        margin: 0 1em;
    }
    nav ul li.nav-item .tooltip{
        position: absolute;
        font-size: 18px;
        top: -200%;
        right: -50%;
        width: fit-content;
        text-wrap: nowrap;
        visibility: hidden;
        opacity: 0;
        background-color: black;
        color: white;
        padding: 0.8em;
        border-radius: 0.5em;
        margin-top: -50px;
        transition: all 0.5s 0.1s;
    }
    nav ul li.nav-item .tooltip::before{
        content: '';
        position: absolute;
        bottom: -8px;
        right: 50%;
        width: 1em;
        height: 1em;
        transform: translateX(50%) rotate(45deg);
        background-color: black;
    }
    nav ul li.nav-item:last-child .tooltip{
        right: -10%;
    }
    nav ul li.nav-item:last-child .tooltip::before{
        right: 10%;
        transform: translateX(-50%) rotate(45deg);
    }
    nav ul li.nav-item:hover .tooltip{
        visibility: visible;
        opacity: 1;
        margin-top: 0;
    }
</style>
<body>
    <header>
        <nav>
            <span>Navbar</span>
            <ul>
                <li class="nav-item">Home
                    <div class="tooltip">Homepage</div>
                </li>
                <li class="nav-item">Projects
                    <div class="tooltip">Here is everything i have built</div>
                </li>
                <li class="nav-item">Blog
                    <div class="tooltip">Here is everything i have write</div>
                </li>
            </ul>
        </nav>
    </header>
</body>
</html>
