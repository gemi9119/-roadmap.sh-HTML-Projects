<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    h2{
        margin-bottom: 0.5rem;
    }
    .task-tracker{
        width: 500px;
    }
    .form-group{
        margin-bottom: 1rem;
        display: flex;
        position: relative;
        border: 1px solid;
        border-radius: 8px;
        overflow: hidden;
        padding: 0.15rem;
    }
    .form-group:has(#taskName:focus-visible){
        outline: 1px solid;
    }
    #taskName{
        width: 100%;
        padding: 0.4rem 5rem 0.4rem 0.5rem;
        border: none;
    }
    #taskName:focus-visible{
        outline: none;
    }
    .btn-submit{
        border: none;
        border-radius: 6px;
        background-color: black;
        color: white;
        padding: 0 0.5rem;
        cursor: pointer;
        transition: transform 0.1s ease;
    }
    .btn-submit:active{
        transform: scale(0.95);
    }
    .enter-icon,.delete-icon{
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
    }
    .task-item{
        width: 100%;
        display: flex;
        align-items: center;
        position: relative;
        text-align: start;
        border-bottom: 1px solid rgb(128, 128, 128, 0.3);
        overflow-wrap: anywhere;
    }
    .task-item input[type="checkbox"]{
        margin-right: 0.5rem;
        appearance: none;
        width: 1.2em;
        height: 1.2em;
        display: inline-block;
        background-color: white;
        border: 1px solid;
        border-radius: 4px;
        flex-shrink: 0;
    }
    .task-item input[type="checkbox"]:checked{
        border: 1px solid rgb(82, 81, 81);
        background-color: gray;
    }
    .task-item:has(input[type="checkbox"]:checked) label{
        color: gray;
        text-decoration: line-through;
    }
    .task-item label{
        width: 100%;
        padding: 0.5rem;
    }
    .btn-delete{
        position: absolute;
        right: 0;
        border: none;
        background: none;
        cursor: pointer;
        padding: 0.5rem;
    }
    .btn-delete:active{
        transform: scale(0.95);
    }

    .empty-message{
        text-align: center;
        color: #888;
        padding: 1.5rem 0;
        font-style: italic;
    }

    .storage-status{
        min-height: 1.25rem;
        margin-top: 0.5rem;
        color: #a12622;
        font-size: 0.875rem;
    }
</style>
<body>
    <main class="task-tracker">
        <h2>Task Tracker</h2>
        <form id="task-form">
            <div class="form-group">
                <input type="text" name="taskName" id="taskName" placeholder="Start writing and press enter to create task" autocomplete="off">
                <button type="submit" class="btn-submit">
                    <span class="enter-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
                            <path d="M0 0h24v24H0z" fill="none" />
                            <path fill="currentColor" d="M21 4a1 1 0 0 1 .993.883L22 5v6.5a3.5 3.5 0 0 1-3.308 3.495L18.5 15H5.415l3.292 3.293a1 1 0 0 1 .083 1.32l-.083.094a1 1 0 0 1-1.32.083l-.094-.083l-5-5a1 1 0 0 1-.097-.112l-.071-.11l-.054-.114l-.035-.105l-.025-.117l-.007-.06L2 14l.003-.075l.017-.126l.03-.111l.044-.111l.052-.098l.064-.092l.083-.094l5-5a1 1 0 0 1 1.497 1.32l-.083.094L5.415 13H18.5a1.5 1.5 0 0 0 1.493-1.355L20 11.5V5a1 1 0 0 1 1-1" />
                        </svg>
                    </span>
                </button>
            </div>
        </form>
        <div id="task-lists"></div>
        <p id="storage-status" class="storage-status" role="status" aria-live="polite"></p>
    </main>
</body>
<script>
    // ==========================================
    // 1. State Management & DOM Elements
    // ==========================================
    const STORAGE_KEY = 'task_tracker_app';
    let storageWarning = '';
    let tasks = loadTasks();

    const taskForm = document.getElementById('task-form');
    const taskInput = document.getElementById('taskName');
    const taskContainer = document.getElementById('task-lists');
    const storageStatus = document.getElementById('storage-status');

    // ==========================================
    // 2. Application Initialization
    // ==========================================
    document.addEventListener('DOMContentLoaded', initApp);

    function initApp(){
        taskForm.addEventListener('submit', handleFormSubmit);
        taskContainer.addEventListener('click', handleContainerClick);
        taskContainer.addEventListener('change', handleContainerChange);
        renderTasks();
        setStorageStatus(storageWarning);
    }

    // ==========================================
    // 3. Event Handlers
    // ==========================================
    function handleFormSubmit(e){
        e.preventDefault();

        const name = taskInput.value.trim();
        if(!name){
            alert('Please enter writing task before create');
            return;
        }

        addTask(name);
        taskInput.value = '';
        updateStateAndRender();
    }

    function handleContainerClick(e) {
        const deleteBtn = e.target.closest('.btn-delete');
        if(!deleteBtn) return;

        const taskId = deleteBtn.dataset.taskId;
        if(confirm('คุณต้องการลบงานนี้?')){
            deleteTask(taskId);
            updateStateAndRender();
        }
    }

    function handleContainerChange(e){
        if(e.target.matches('input[type="checkbox"]')){
            const targetId = e.target.dataset.taskId;

            toggleTaskStatus(targetId);
            updateStateAndRender();
        }
    }

    function updateStateAndRender() {
        sortTasks();
        renderTasks();
        saveTasks();
    }

    // ==========================================
    // 4. Data Operations (State Mutations)
    // ==========================================
    function addTask(name) {
        tasks.push({
            id: generatedUniqueId(),
            name,
            completed: false
        });
    }

    function toggleTaskStatus(taskId){
        tasks =  tasks.map(task =>
            String(task.id) === String(taskId)
                ? {...task, completed: !task.completed}
                : task
        );
    }

    function deleteTask(taskId) {
        tasks = tasks.filter(task => String(task.id) !== String(taskId));
    }

    function sortTasks() {
        tasks.sort((a, b) => Number(a.completed) - Number(b.completed));
    }

    function generatedUniqueId(){
        if(typeof crypto !== 'undefined' && crypto.randomUUID) {
            return crypto.randomUUID();
        }
        return `${Date.now()}-${Math.random().toString(36).substring(2, 9)}`;
    }
    
    
    // ==========================================
    // 5. Local Storage Operations
    // ==========================================
    function saveTasks(){
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            setStorageStatus('');
            return true;
        } catch (error) {
            console.error('Failed to save tasks to local storage:', error);
            // Keep the rendered in-memory state visible, but tell the user it will not survive a reload.
            setStorageStatus('Changes could not be saved. They will be lost when you reload this page.');
            return false;
        }
    }

    function loadTasks(){
        try {
            const data = localStorage.getItem(STORAGE_KEY);
            if(!data) return [];

            const parsed = JSON.parse(data);
            if(!Array.isArray(parsed)) {
                storageWarning = 'Saved task data is invalid and could not be loaded.';
                return [];
            }

            const seenIds = new Set();
            const validTasks = parsed.filter(task => {
                const hasValidId = task &&
                    ((typeof task.id === 'string' && task.id.trim() !== '') ||
                    (typeof task.id === 'number' && Number.isFinite(task.id)));
                const isValidTask = task &&
                    typeof task === 'object' &&
                    !Array.isArray(task) &&
                    hasValidId &&
                    typeof task.name === 'string' &&
                    typeof task.completed === 'boolean';

                if(!isValidTask) return false;

                // IDs must be unique because they are used to target task actions and label controls.
                const id = String(task.id);
                if(seenIds.has(id)) return false;

                seenIds.add(id);
                return true;
            });

            if(validTasks.length !== parsed.length) {
                storageWarning = 'Some invalid saved tasks were skipped.';
            }

            return validTasks;
        } catch (error) {
            console.error('Failed to load tasks from local storage:', error);
            storageWarning = 'Saved tasks could not be loaded. The stored data may be unavailable or invalid.';
            return [];
        }
    }

    function setStorageStatus(message) {
        storageStatus.textContent = message;
    }
    
    
    // ==========================================
    // 6. UI Rendering & DOM Building
    // ==========================================
    function renderTasks(){
        taskContainer.replaceChildren();

        if(tasks.length === 0) {
            const emptyMsg = document.createElement('p');
            emptyMsg.className = 'empty-message';
            emptyMsg.textContent = 'No Task';
            taskContainer.appendChild(emptyMsg);
            return;
        }

        const fragment = document.createDocumentFragment();

        tasks.forEach(task => 
            fragment.appendChild(createTaskElement(task))
        );

        taskContainer.appendChild(fragment);
    }

    function createTaskElement(task) {
        const item = document.createElement('div');
        item.className = 'task-item';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `task-${task.id}`;
        checkbox.dataset.taskId = task.id;
        checkbox.defaultChecked = Boolean(task.completed);

        const label = document.createElement('label');
        label.htmlFor = `task-${task.id}`;
        label.textContent = task.name;

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'submit';
        deleteBtn.className = 'btn-delete';
        deleteBtn.dataset.taskId = task.id;
        deleteBtn.setAttribute('aria-label', 'Delete task');
        deleteBtn.innerHTML = `
            <span class="delete-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path fill="currentColor" fill-rule="evenodd" d="M8.586 2.586A2 2 0 0 1 10 2h4a2 2 0 0 1 2 2v2h3a1 1 0 1 1 0 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8a1 1 0 0 1 0-2h3V4a2 2 0 0 1 .586-1.414M10 6h4V4h-4zm1 4a1 1 0 1 0-2 0v8a1 1 0 1 0 2 0zm4 0a1 1 0 1 0-2 0v8a1 1 0 1 0 2 0z" clip-rule="evenodd" />
                </svg>
            </span>
        `

        item.appendChild(checkbox);
        item.appendChild(label);
        item.appendChild(deleteBtn);

        return item;
    }
</script>
</html>
