<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Consent</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .cookie-wrapper{
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        position: absolute;
        bottom: 1em;
        right: 1em;

        background-color: black;
        color: white;
        border-radius: 12px;

        padding: 1.2em;
    }
    /* .cookie-wrapper.hidden{
        display: none;
    } */
    .cookie-wrapper .container{
        max-width: 180px;
        min-height: 200px;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 1em;
    }
    .container .logo{
        width: 40px;
        height: 40px;
        transform: scaleX(-1);
    }
    .container .message{
        margin-top: auto;
        width: 80%;
        line-clamp: 3;
    }
    .container .btn-cookie{
        font-weight: bold;
        border: none;
        border-radius: 0.5em;
        padding: 0.7em;
        cursor: pointer;
        user-select: none;
    }
    .btn-cookie:hover{
        background-color: rgb(221, 219, 219);
    }
    .btn-cookie:active{
        transform: scale(0.99);
    }
    .container .btn-close{
        width: 1em;
        height: 1em;
        font-size: 1em;
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        cursor: pointer;
        transition: transform 0.1s;
    }
    .btn-close:hover{
        transform: scale(1.5);
    }
    .btn-close:active{
        transform: scale(0.9);
    }
</style>
<body>
    <div class="cookie-wrapper">
        <div class="container">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path fill="currentColor" d="M15.5 2a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3M21 5a1 1 0 1 0 0 2a1 1 0 1 0 0-2" />
                    <path fill="currentColor" d="M21.6 11.04a.97.97 0 0 0-.85-.17c-.29.07-.52.11-.74.11c-1.65 0-3-1.35-3-2.95c0-.03.02-.13.02-.17c.01-.32-.13-.62-.37-.82c-.25-.2-.58-.27-.88-.19c-.29.08-.53.11-.76.11c-1.65 0-3-1.35-3-3.01c0-.22.03-.45.1-.72A.99.99 0 0 0 11.06 2C5.88 2.5 2 6.79 2 11.98C2 17.51 6.49 22 12 22s10-4.5 10-10.02v-.16c-.01-.31-.16-.59-.4-.78M9 8c.55 0 1 .45 1 1s-.45 1-1 1s-1-.45-1-1s.45-1 1-1m-1.5 6c-.83 0-1.5-.67-1.5-1.5S6.67 11 7.5 11s1.5.67 1.5 1.5S8.33 14 7.5 14m3 4c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5s1.5.67 1.5 1.5s-.67 1.5-1.5 1.5m2-5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5s1.5.67 1.5 1.5s-.67 1.5-1.5 1.5m2.5 3c-.55 0-1-.45-1-1s.45-1 1-1s1 .45 1 1s-.45 1-1 1" />
                </svg>
            </div>
            <div class="message">
                <p>We use cookies to improve your user experience.</p>
            </div>
            <button class="btn-cookie">I like Cookies</button>
            <div class="btn-close">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path fill="currentColor" d="m6.4 18.308l-.708-.708l5.6-5.6l-5.6-5.6l.708-.708l5.6 5.6l5.6-5.6l.708.708l-5.6 5.6l5.6 5.6l-.708.708l-5.6-5.6z" />
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    function showConsentBanner(){
        document.querySelector('.cookie-wrapper').style.display = 'block';
    }
    function hideConsentBanner(){
        document.querySelector('.cookie-wrapper').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
        const currentConsent = localStorage.getItem('app_cookie_consent_v1');

        if(!currentConsent){
            showConsentBanner();
            document.querySelector('.btn-cookie').addEventListener('click', () => {
                localStorage.setItem('app_cookie_consent_v1', 'true')
                location.reload();
            });
        } else {
            hideConsentBanner();
        }
    })

</script>
